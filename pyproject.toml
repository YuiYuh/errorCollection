[project]
name = "wrongbook"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
